[workspace]
authors = ["Sylens Wong <qiumin14@163.com>"]
channels = ["conda-forge"]
name = "DevSSH"
platforms = ["linux-aarch64", "linux-64", "osx-arm64", "osx-64"]
version = "0.1.8"
preview = ["pixi-build"]

[tasks.clean_linux]
cmd = "rm -f bin/devssh-linux-{{ arch }}"
args = [{ arg = "arch", default = "amd64" }]
cwd = "./"

[tasks.build_linux_arch]
cmd = "GOOS=linux GOARCH={{ arch }} go build -o bin/devssh-linux-{{ arch }} ./cmd/devssh/"
args = [{ arg = "arch", default = "amd64" }]
cwd = "./"
depends-on = [{ task = "clean_linux", args = ["{{ arch }}"] }]

[tasks.clean_darwin]
cmd = "rm -f bin/devssh-darwin-{{ arch }}"
args = [{ arg = "arch", default = "amd64" }]
cwd = "./"

[tasks.build_darwin_arch]
cmd = "GOOS=darwin GOARCH={{ arch }} go build -o bin/devssh-darwin-{{ arch }} ./cmd/devssh/"
args = [{ arg = "arch", default = "amd64" }]
cwd = "./"
depends-on = [{ task = "clean_darwin", args = ["{{ arch }}"] }]

[tasks.build]
cmd = "echo 'Build Done'"
depends-on = [
    { task = "build_linux_arch", args = ["amd64"] },
    { task = "build_linux_arch", args = ["arm64"] },
    { task = "build_darwin_arch", args = ["amd64"] },
    { task = "build_darwin_arch", args = ["arm64"] }
]
cwd = "./"

[tasks.publish_arch]
cmd = "pixi publish --target-channel https://prefix.dev/channels/sylens -t {{ arch }}"
args = [{ arg = "arch", default = "linux-64" }]
cwd = "./"

[tasks.publish]
cmd = "echo 'Publish Done'"
depends-on = [
    { task = "publish_arch", args = ["linux-64"] },
    { task = "publish_arch", args = ["linux-aarch64"] },
    { task = "publish_arch", args = ["osx-64"] },
    { task = "publish_arch", args = ["osx-arm64"] }
]
cwd = "./"

[tasks.test]
cmd = "go test ./..."
cwd = "./"

[tasks.test_verbose]
cmd = "go test -v ./..."
cwd = "./"

[tasks.test_short]
cmd = "go test -short ./..."
cwd = "./"

[tasks.test_integration]
cmd = "bash scripts/test_integration.sh"
cwd = "./"

[activation.env]
CGO_ENABLED = "0"

[dependencies]
go = ">=1.25.4,<2"

[package]
name = "DevSSH"
version = "0.1.8"

[package.build.backend]
name = "pixi-build-rattler-build"
version = "0.3.*" 
